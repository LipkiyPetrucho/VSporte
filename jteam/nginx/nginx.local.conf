worker_processes auto;

events { worker_connections 1024; }

http {

    # ---------- backend (Daphne ASGI: HTTP + WebSocket) ---------- #
    upstream webapp {
        server web-app:8000;
    }

    # ---------- базовые настройки ---------- #
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 100m;
    sendfile        on;
    keepalive_timeout 65;


    # ---------- сервер (локальная разработка, только HTTP) ---------- #
    server {
        listen 80;
        server_name localhost jteam.ru www.jteam.ru;

        # ----- статические и медиа -----
        # STATIC_ROOT (collectstatic → ManifestStaticFilesStorage), не сырой jteam/static
        location /static/ {
            alias /app/staticfiles/;
        }
        location /media/ {
            alias /app/media/;
            add_header Access-Control-Allow-Origin *;
        }

        # WebSocket (чат игры и др.) — Upgrade обязателен
        location /ws/ {
            proxy_pass http://webapp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # приложение (HTTP)
        location / {
            proxy_pass http://webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}

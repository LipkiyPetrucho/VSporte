# Прод: docker compose -f docker-compose.prod.yml up -d --build
# Требуется: .env с DJANGO_ENV=prod, сертификаты в ./certs/{fullchain,privkey}.pem
# Бэкапы БД: сервис backup пишет ./backups/; restore — см. PROD_CHECKLIST.md
# Smoke: python scripts/prod_smoke.py --base-url https://jteam.ru
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./jteam/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media
    depends_on:
      - web-app
    restart: unless-stopped
    networks:
      - vsporte

  web-app:
    build:
      context: .
    # Код и entrypoint из образа — без bind ./jteam
    volumes:
      - media_data:/jteam/media
      - staticfiles_data:/jteam/staticfiles
    env_file:
      - .env
    environment:
      - DB_HOST=${POSTGRES_DB_HOST}
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASS=${POSTGRES_DB_PASSWORD}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - vsporte

  database:
    image: postgres:14.6-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - vsporte
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0.5-alpine
    hostname: redis
    # Порт наружу не публикуем
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - vsporte
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    hostname: worker
    restart: always
    entrypoint: celery
    command: -A jteam.celery:app worker --loglevel=info
    volumes:
      - media_data:/jteam/media
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=${POSTGRES_DB_HOST}
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASS=${POSTGRES_DB_PASSWORD}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    networks:
      - vsporte

  celery-beat:
    build:
      context: .
    restart: always
    entrypoint: celery
    command: [ "-A", "jteam.celery:app", "beat", "--loglevel=info" ]
    volumes:
      - media_data:/jteam/media
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=${POSTGRES_DB_HOST}
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASS=${POSTGRES_DB_PASSWORD}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    networks:
      - vsporte

  # Периодический pg_dump на хост ./backups (см. PROD_CHECKLIST.md)
  backup:
    image: postgres:14.6-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGUSER: ${POSTGRES_DB_USER}
      PGPASSWORD: ${POSTGRES_DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB_NAME}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      database:
        condition: service_healthy
    networks:
      - vsporte
    entrypoint: ["/bin/sh", "/scripts/backup-postgres.sh"]

networks:
  vsporte:


volumes:
  postgres_data:
  redis_data:
  media_data:
  staticfiles_data:
